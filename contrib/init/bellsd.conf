description "FirebugCoin Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env apterusd_BIN="/usr/bin/apterusd"
env apterusd_USER="lebowskiscoin"
env apterusd_GROUP="lebowskiscoin"
env apterusd_PIDDIR="/var/run/apterusd"
# upstart can't handle variables constructed with other variables
env apterusd_PIDFILE="/var/run/apterusd/apterusd.pid"
env apterusd_CONFIGFILE="/etc/lebowskiscoin/lebowskiscoin.conf"
env apterusd_DATADIR="/var/lib/apterusd"

expect fork

respawn
respawn limit 5 120
kill timeout 60

pre-start script
    # this will catch non-existent config files
    # apterusd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$apterusd_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run apterusd."
        echo "The setting must appear in $apterusd_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following"
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is also recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"FirebugCoin Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$apterusd_PIDDIR"
    chmod 0755 "$apterusd_PIDDIR"
    chown $apterusd_USER:$apterusd_GROUP "$apterusd_PIDDIR"
    chown $apterusd_USER:$apterusd_GROUP "$apterusd_CONFIGFILE"
    chmod 0660 "$apterusd_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$apterusd_PIDFILE" \
    --chuid $apterusd_USER:$apterusd_GROUP \
    --exec "$apterusd_BIN" \
    -- \
    -pid="$apterusd_PIDFILE" \
    -conf="$apterusd_CONFIGFILE" \
    -datadir="$apterusd_DATADIR" \
    -disablewallet \
    -daemon

